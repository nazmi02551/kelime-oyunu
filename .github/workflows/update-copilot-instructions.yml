name: Update Copilot Instructions

# Trigger: Her push, PR veya manuel
on:
  push:
    branches:
      - main
      - 'fixes-*'
      - 'feature-*'
  pull_request:
  workflow_dispatch:  # Manuel tetikleme
  
permissions:
  contents: write
  pull-requests: write

jobs:
  update-instructions:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Tüm geçmişi al
      
      - name: Get recent changes
        id: changes
        run: |
          # Son commit'teki değişiklikleri al
          echo "### 📝 Değişen Dosyalar:" > changes.txt
          git diff --name-only HEAD~1 HEAD >> changes.txt
          
          # Önemli değişiklikleri say
          IMPORTANT_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E "(backend/routes/|backend/models/|frontend/src/screens/|frontend/src/services/|requirements.txt|package.json|\.env)" | wc -l)
          echo "important_count=$IMPORTANT_FILES" >> $GITHUB_OUTPUT
          
          # Yeni dosya/klasör eklendi mi?
          NEW_FILES=$(git diff --name-status HEAD~1 HEAD | grep "^A" | wc -l)
          echo "new_files=$NEW_FILES" >> $GITHUB_OUTPUT
          
          # Değişiklik listesi
          CHANGES=$(cat changes.txt)
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Check if instructions need update
        id: check
        run: |
          # Akıllı kontrol: Sadece önemli değişikliklerde bildir
          IMPORTANT=${{ steps.changes.outputs.important_count }}
          NEW_FILES=${{ steps.changes.outputs.new_files }}
          
          # Kriterler:
          # - 3+ önemli dosya değişti VEYA
          # - Yeni dosya/klasör eklendi
          if [ "$IMPORTANT" -ge 3 ] || [ "$NEW_FILES" -ge 1 ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "✅ Instructions güncelleme gerekiyor!"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "⏭️ Küçük değişiklik, güncelleme gerekmiyor"
          fi
      
      - name: Create update reminder issue
        if: steps.check.outputs.needs_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Aynı isimde açık issue var mı kontrol et (spam önleme)
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'copilot-update'
            });
            
            if (issues.data.length > 0) {
              console.log('⏭️ Zaten açık bir güncelleme issue var, yeni oluşturulmadı.');
              return;
            }
            
            // Yeni issue oluştur
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '📝 Copilot Instructions Güncelleme Önerisi',
              body: `## 🔔 Önemli Değişiklikler Tespit Edildi
              
              Son commit'te **${{ steps.changes.outputs.important_count }}** önemli dosya değiştirildi.
              **${{ steps.changes.outputs.new_files }}** yeni dosya/klasör eklendi.
              
              \`.github/copilot-instructions.md\` dosyasını güncellemeniz önerilir.
              
              ### 🚀 Hızlı Güncelleme (30 saniye):
              
              1. VS Code'da \`Ctrl+Shift+P\`
              2. **"Tasks: Run Task"** seç
              3. **"🤖 Update Copilot Instructions"** seç
              4. Enter
              
              Veya chat'te:
              \`\`\`
              @workspace .github/prompts/update-instructions.prompt.md 
              dosyasındaki talimatlara göre copilot-instructions.md'yi güncelle
              \`\`\`
              
              ### 📊 Değişiklikler:
              
              \`\`\`
              ${{ steps.changes.outputs.CHANGES }}
              \`\`\`
              
              ---
              
              💡 **Not:** Küçük bug fix'ler için güncelleme gerekmez. Bu issue sadece önemli değişiklikler için açılır.
              
              ✅ Güncelleme yaptıktan sonra bu issue'yu kapatabilirsiniz.`,
              labels: ['documentation', 'copilot-update']
            });
